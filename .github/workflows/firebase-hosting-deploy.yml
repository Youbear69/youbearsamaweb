name: Deploy to Firebase Hosting on push

on:
  push:
    branches:
      - main

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Deploy to Firebase Hosting
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_VTUBERGAME_676DC }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "### Deploy Error" >> $GITHUB_STEP_SUMMARY
            echo "Repository secret **FIREBASE_SERVICE_ACCOUNT_VTUBERGAME_676DC** is missing or empty!" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

          printf '%s\n' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-key.json"

          if ! node -e "JSON.parse(require('fs').readFileSync(process.env.RUNNER_TEMP + '/firebase-key.json', 'utf8'))" 2>&1; then
            echo "### Deploy Error" >> $GITHUB_STEP_SUMMARY
            echo "Repository secret is not valid JSON!" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-key.json"

          echo "Starting Firebase deployment..."
          npx --yes firebase-tools@15.34.0 deploy --only hosting --project vtubergame-676dc --non-interactive 2>&1 | tee deploy.log
          DEPLOY_EXIT=${PIPESTATUS[0]}

          echo "### Firebase Deploy Log" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat deploy.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

          if [ $DEPLOY_EXIT -ne 0 ]; then
            echo "Deploy failed with code $DEPLOY_EXIT"
            exit $DEPLOY_EXIT
          fi
