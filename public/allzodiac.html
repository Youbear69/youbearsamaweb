<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>โควต้าราศี - ศึก 12 วีทูบเบอร์</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/animations.css">
</head>
<body>
  <!-- Moving Cosmic Background -->
  <div class="cosmic-bg">
    <div class="cosmic-orb-1"></div>
    <div class="cosmic-orb-2"></div>
    <div class="cosmic-orb-3"></div>
    <div class="cosmic-stars"></div>
  </div>

  <!-- Main Content -->
  <main class="main-content">
    <!-- Header Banner -->
    <div style="display: flex; align-items: center; justify-content: flex-start; gap: 2rem; width: 100%; max-width: 1140px; margin-top: 1rem; margin-bottom: 2rem; flex-wrap: wrap;">
      <a href="/12vtubergame"><img src="/assets/images/12 v.png" alt="ศึก 12 วีทูบเบอร์ Logo" style="max-width: 220px; width: 100%; height: auto;"></a>
      <div style="text-align: left;">
        <h1 class="page-title" style="margin-bottom: 0.4rem; text-align: left;">โควต้าราศี</h1>
        <div class="countdown-badge" style="margin: 0; padding: 0.6rem 1.8rem;">
          <span id="live-countdown">ไลฟ์ในอีก : 00 เดือน 00 วัน</span>
        </div>
      </div>
    </div>

    <!-- 12 Zodiac Grid -->
    <div id="zodiac-grid" class="zodiac-grid">
      <!-- Zodiac cards injected by JavaScript -->
    </div>

    <!-- Bottom CTA -->
    <div style="text-align: center; margin-top: 1.5rem;">
      <p style="font-size: 1.25rem; color: #ffffff; margin-bottom: 1rem; font-weight: 600;">อยากร่วมไลฟ์ครั้งนี้ ?</p>
      <a href="/12vtubergame/register" class="btn-primary" style="padding: 0.85rem 3.2rem;">ลงทะเบียน</a>
    </div>
  </main>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="/js/firebase-config.js"></script>
  <script src="/js/common.js"></script>
  <script src="/js/allzodiac.js"></script>
</body>
</html>
