<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>โควต้าราศี - ศึก 12 วีทูบเบอร์</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/animations.css">
</head>
<body>
  <!-- Moving Cosmic Background -->
  <div class="cosmic-bg">
    <div class="cosmic-orb-1"></div>
    <div class="cosmic-orb-2"></div>
    <div class="cosmic-orb-3"></div>
    <div class="cosmic-stars"></div>
  </div>

  <!-- Universal Top Navigation Bar & Social Pill -->
  <header class="top-nav-bar">
    <nav class="nav-pill-group">
      <a href="https://yuubearsama.online/" class="nav-pill-link">Home</a>
      <a href="/12vtubergame" class="nav-pill-link active">ศึก 12 วีทูบเบอร์</a>
      <a href="/12vtubergame/minigame" class="nav-pill-link">Mini Game</a>
    </nav>
    <div class="top-social-group">
      <a href="https://www.youtube.com/@yuubeargame" target="_blank" rel="noopener noreferrer" class="social-pill-btn" title="YouTube: @yuubeargame">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/></svg>
      </a>
      <a href="https://x.com/bearuwu_001" target="_blank" rel="noopener noreferrer" class="social-pill-btn" title="X: @bearuwu_001">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="currentColor"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
      </a>
      <a href="https://ezdn.app/youbear" target="_blank" rel="noopener noreferrer" class="social-pill-btn social-pill-ezdn" title="EasyDonate: @youbear">
        <img src="/easydonate-symbol-bg-brand.svg" alt="EasyDonate" class="ezdn-nav-icon">
      </a>
    </div>
  </header>

  <!-- Main Content -->
  <main class="main-content" style="padding-top: 5rem;">
    <!-- Zodiac Header Banner -->
    <div class="zodiac-header-banner" style="margin-top: 1rem;">
      <div style="display: flex; align-items: center; gap: 1.5rem; flex-wrap: wrap;">
        <a href="/12vtubergame/allzodiac"><img src="/assets/images/12 v.png" alt="ศึก 12 วีทูบเบอร์" style="max-width: 190px; width: 100%; height: auto;"></a>
        
        <div class="zodiac-title-group">
          <div class="zodiac-title-icon" id="zodiac-icon-box">
            <!-- Injected by JS -->
          </div>
          <div class="zodiac-title-texts">
            <h2 id="zodiac-title-text">โควต้าราศี</h2>
            <p id="zodiac-date-text">--</p>
          </div>
        </div>
      </div>
    </div>

    <!-- Filter Dropdown Toolbar for Proposed VTubers -->
    <div id="proposed-filter-bar" class="proposed-filter-bar" style="display: none; max-width: 1140px; margin-top: 1rem;">
      <label for="proposed-zodiac-select">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"></polygon></svg>
        <span>แยกดูตามราศี:</span>
      </label>
      <select id="proposed-zodiac-select" class="form-select" style="min-width: 220px;">
        <option value="">ทุกราศี (ทั้งหมด)</option>
      </select>
    </div>

    <!-- Participants Grid -->
    <div id="participants-grid" class="registrants-grid">
      <!-- Injected by JS -->
    </div>

    <!-- Register Button at Bottom or Closed Notice -->
    <div id="zodiac-bottom-cta" style="text-align: center; margin-top: 1.5rem;">
      <a href="/12vtubergame/register" class="btn-primary" style="padding: 0.75rem 3.2rem; font-size: 1.15rem;">ลงทะเบียน</a>
    </div>
    <div id="zodiac-closed-box" class="registration-closed-box" style="display: none; margin: 1.5rem auto;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
      <span id="zodiac-closed-msg-text">ขณะนี้ได้ปิดรับลงทะเบียนเรียบร้อย</span>
    </div>
  </main>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="/js/firebase-config.js"></script>
  <script src="/js/common.js"></script>
  <script src="/js/zodiac.js"></script>
</body>
</html>
